---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: kii-os
# description will be included in the image's metadata
description: Kii-OS — système atomique souverain basé sur Aurora, par HandKii

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/aurora
image-version: stable # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      copr:
        - atim/starship
    install:
      packages:
        - micro
        - starship
    remove:
      packages:
        # example: removing firefox (in favor of the flatpak)
        # "firefox" is the main package, "firefox-langpacks" is a dependency
        - firefox
        - firefox-langpacks # also remove firefox dependency (not required for all packages, this is a special case)

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - org.mozilla.firefox
          - org.gnome.Loupe
      - scope: user # Also add Flathub user repo, but no user packages

  - type: signing # this sets up the proper policy & signing files for signed images to work fully

  # Identité du système : Kii-OS remplace Aurora dans /etc/os-release.
  # Placé EN DERNIER volontairement : changer la clé ID peut perturber
  # l'identification des dépôts COPR pendant le build (cf. doc BlueBuild),
  # donc on le fait après l'installation des paquets.
  # ID_LIKE=fedora est OBLIGATOIRE : c'est lui qui permet aux outils tiers
  # de continuer à reconnaître le système comme une Fedora.
  # Les clés non listées ici (VERSION, VERSION_ID, OSTREE_VERSION...) sont
  # laissées intactes et continuent de se mettre à jour à chaque build.
  - type: os-release
    properties:
      NAME: Kii-OS
      PRETTY_NAME: Kii-OS
      ID: kii-os
      ID_LIKE: fedora
      VARIANT: Kii-OS
      VARIANT_ID: kii-os
      IMAGE_ID: kii-os
      DEFAULT_HOSTNAME: kii-os
      VERSION_CODENAME: souverain
      CPE_NAME: "cpe:/o:teardropshack:kii-os:44"
      ANSI_COLOR: "0;38;2;168;85;247" # violet Kii-OS #A855F7
      HOME_URL: "https://github.com/TearDropsHack/Kii-os"
      DOCUMENTATION_URL: "https://github.com/TearDropsHack/Kii-os#readme"
      SUPPORT_URL: "https://github.com/TearDropsHack/Kii-os/issues"
      BUG_REPORT_URL: "https://github.com/TearDropsHack/Kii-os/issues"
